name: Hangeul Miniature Tests

on:
  push:
    branches: [main, "fix/**", "feature/**"]
  pull_request:
    branches: [main]

jobs:
  minimum-streamlit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install "streamlit==1.38.0"
      - run: python -m unittest discover -s tests -v
      - name: AppTest core generation
        run: |
          python - <<'PY'
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file("app.py", default_timeout=20)
          at.run()
          assert not at.exception, at.exception
          at.text_area(key="scene").set_value("작업대 위 작은 우주선 디오라마")
          at.text_input(key="subject").set_value("우주선")
          at.button(key=None).  # placeholder
          PY

  supported-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
